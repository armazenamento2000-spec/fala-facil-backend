spring:
  application:
    name: fala-facil-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/fala_facil
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.falafacil: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  file:
    name: logs/fala-facil.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: sua-chave-secreta-super-segura-com-mais-de-256-bits-aqui-para-producao
  expiration: 900000 # 15 minutos em ms
  refresh-expiration: 604800000 # 7 dias em ms

resilience4j:
  ratelimiter:
    configs:
      default:
        limitRefreshPeriod: 1m
        limitForPeriod: 100
        timeoutDuration: 5s
    instances:
      exerciseSubmit:
        limitRefreshPeriod: 1m
        limitForPeriod: 50
        timeoutDuration: 5s
      login:
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 5s
